name: ledger-api-ci
on:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write
env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ledger-api
jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  build-scan-sign:
    needs: secrets-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Build
        id: build
        uses: docker/build-push-action@v6
        with:
          context: task1-hardening/base
          file: task1-hardening/base/../../app/Dockerfile
          push: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}
        continue-on-error: true
      - name: Build (fallback path)
        if: steps.build.outcome == 'failure'
        run: docker build -t ${{ env.IMAGE }}:${{ github.sha }} .
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: trivy.sarif }
      - run: docker push ${{ env.IMAGE }}:${{ github.sha }}
      - uses: sigstore/cosign-installer@v3
      - name: Sign (keyless)
        run: cosign sign --yes ${{ env.IMAGE }}:${{ github.sha }}
